
# @name: NovaClientBuild
# @type: GitHub Actions Workflow
# @location: .github/workflows/gradle.yml

name: Nova Client Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    name: Build Nova Client
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Gradle Permissions
        run: chmod +x ./gradlew

      - name: Show Java Version
        run: java -version

      - name: Build Nova Client
        run: ./gradlew clean build --stacktrace

      - name: Upload Nova Client JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NovaClient-1.21.11
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 30

  dependency-submission:
    name: Submit Dependency Graph
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Gradle Permissions
        run: chmod +x ./gradlew

      - name: Submit Dependency Graph
        uses: gradle/actions/dependency-submission@v4
